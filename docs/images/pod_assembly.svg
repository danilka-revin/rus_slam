<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="860" height="680" style="background:#0f172a; font-family:'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="stepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Конструкция поворотного модуля: Шкив/Шестерня → Ступица → Вилка</text>
  <text x="430" y="54" fill="#94a3b8" font-size="13" text-anchor="middle">Реальная компоновка: Ведущая шпилька сверху, ступица Subaru в раме 40×40 мм, вилка и мотор-колесо снизу</text>

  <!-- ==================================================================== -->
  <!-- MAIN POD SECTION ASSEMBLY                                            -->
  <!-- ==================================================================== -->
  <g transform="translate(50, 75)">

    <!-- 1. TOP LAYER: GEAR / PULLEY & NEMA 23 (СВЕРХУ) -->
    <!-- Stepper Motor NEMA 23 on Top Bracket -->
    <rect x="80" y="20" width="95" height="90" rx="5" fill="url(#stepperGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="127" y="48" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">NEMA 23</text>
    <text x="127" y="66" fill="#e2e8f0" font-size="10" text-anchor="middle">1.9 Н·м, 2.8A</text>
    <text x="127" y="82" fill="#94a3b8" font-size="9" text-anchor="middle">Шаговый привод</text>
    <!-- Stepper Shaft & Driving Pulley z1 = 20 -->
    <rect x="117" y="110" width="20" height="15" fill="#cbd5e1"/>
    <rect x="107" y="125" width="40" height="22" rx="2" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="127" y="140" fill="#fef3c7" font-size="10" font-weight="bold" text-anchor="middle">z1=20</text>

    <!-- Timing Belt GT2 10mm -->
    <line x1="147" y1="136" x2="320" y2="136" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,3"/>
    <line x1="107" y1="136" x2="220" y2="136" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,3"/>
    <text x="215" y="128" fill="#f87171" font-size="11" font-weight="bold">Ремень GT2 10 мм (1:7.5)</text>

    <!-- Central Threaded Stud / Shaft (M16/M20) extending to top -->
    <rect x="352" y="60" width="16" height="120" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <!-- Heavy Washers and Double Nuts on Top -->
    <rect x="345" y="65" width="30" height="12" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="347" y="80" width="26" height="14" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

    <!-- Driven Pulley / Gear (z2 = 150) ON TOP -->
    <rect x="220" y="122" width="280" height="28" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
    <text x="360" y="141" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">1. ВЕДОМЫЙ ШКИВ / ШЕСТЕРНЯ z2 = 150 (СВЕРХУ)</text>

    <!-- Callout 1 -->
    <path d="M 510 136 L 560 136" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="570" y="140" fill="#38bdf8" font-size="11" font-weight="bold">Шестерня/Шкив привода на верхней шпильке</text>

    <!-- 2. MIDDLE LAYER: SUBARU WHEEL HUB IN 40x40 MM FRAME (ПОСЕРЕДИНЕ) -->
    <!-- Welded Steel Frame 40x40x2 mm -->
    <g transform="translate(170, 165)">
      <!-- Left Tube Section 40x40 -->
      <rect x="0" y="10" width="90" height="45" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="5" y="15" width="80" height="35" fill="#0f172a" stroke="#475569" stroke-dasharray="3,3"/>
      <text x="45" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">40×40 мм</text>

      <!-- Right Tube Section 40x40 -->
      <rect x="290" y="10" width="90" height="45" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="295" y="15" width="80" height="35" fill="#0f172a" stroke="#475569" stroke-dasharray="3,3"/>
      <text x="335" y="37" fill="#94a3b8" font-size="10" text-anchor="middle">40×40 мм</text>

      <!-- Corner gusset / plate welded to frame -->
      <rect x="75" y="8" width="230" height="49" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="190" y="0" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">Угловая косынка рамы со скосом 45°</text>

      <!-- Subaru Wheel Hub Unit (Middle) -->
      <rect x="130" y="15" width="120" height="95" rx="6" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="2.5"/>
      <rect x="110" y="35" width="160" height="18" rx="2" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Mounting Bolts of Hub -->
      <circle cx="122" cy="44" r="4" fill="#f8fafc"/>
      <circle cx="258" cy="44" r="4" fill="#f8fafc"/>
      <text x="190" y="68" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">2. СТУПИЦА SUBARU</text>
      <text x="190" y="85" fill="#1e293b" font-size="10" font-weight="bold" text-anchor="middle">Двухрядный радиально-упорный</text>
      <text x="190" y="100" fill="#1e293b" font-size="9" text-anchor="middle">подшипник (&gt;38 кН, под 250 кг)</text>
    </g>

    <!-- Callout 2 -->
    <path d="M 470 230 L 560 230" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="570" y="226" fill="#38bdf8" font-size="11" font-weight="bold">Ступица Subaru вварена в раму</text>
    <text x="570" y="242" fill="#94a3b8" font-size="10">Воспринимает 100% веса и ударов</text>

    <!-- 3. LOWER LAYER: WELDED STEEL FORK (СНИЗУ СТУПИЦЫ) -->
    <!-- Fork Base Plate connected to rotating hub bottom flange -->
    <rect x="285" y="285" width="150" height="16" rx="2" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Left Fork Leg (Vertical drop arm) -->
    <path d="M 290 301 L 290 490" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <!-- Right Fork Leg (Vertical drop arm) -->
    <path d="M 430 301 L 430 490" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <rect x="270" y="340" width="180" height="24" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="360" y="356" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">3. ПОВОРОТНАЯ СТАЛЬНАЯ ВИЛКА</text>

    <!-- Callout 3 -->
    <path d="M 440 375 L 560 375" stroke="#c084fc" stroke-width="1.5"/>
    <text x="570" y="371" fill="#c084fc" font-size="11" font-weight="bold">Стальная сварная вилка (5–6 мм)</text>
    <text x="570" y="387" fill="#94a3b8" font-size="10">Жестко закреплена к вращающейся части</text>

    <!-- 4. BOTTOM LAYER: XIAOMI M365 PRO MOTOR WHEEL (В ВИЛКЕ) -->
    <!-- Solid Perforated Rubber Tyre with red rim -->
    <g transform="translate(360, 475)">
      <!-- Tyre Outer Circle -->
      <circle cx="0" cy="0" r="85" fill="url(#tireGrad)" stroke="#3f3f46" stroke-width="3"/>
      <!-- Perforation Holes for Damping (circular damping holes seen in photo) -->
      <g fill="#09090b" stroke="#27272a" stroke-width="1">
        <circle cx="-62" cy="0" r="8"/><circle cx="62" cy="0" r="8"/>
        <circle cx="0" cy="-62" r="8"/><circle cx="0" cy="62" r="8"/>
        <circle cx="-44" cy="-44" r="8"/><circle cx="44" cy="-44" r="8"/>
        <circle cx="-44" cy="44" r="8"/><circle cx="44" cy="44" r="8"/>
        <circle cx="-58" cy="-23" r="8"/><circle cx="58" cy="-23" r="8"/>
        <circle cx="-58" cy="23" r="8"/><circle cx="58" cy="23" r="8"/>
        <circle cx="-23" cy="-58" r="8"/><circle cx="23" cy="-58" r="8"/>
        <circle cx="-23" cy="58" r="8"/><circle cx="23" cy="58" r="8"/>
      </g>

      <!-- Red Rim Ring Accent (Exact as in Xiaomi M365 Pro photo) -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#ef4444" stroke-width="3.5"/>

      <!-- Motor Wheel Aluminum Hub (Grey) -->
      <circle cx="0" cy="0" r="48" fill="#334155" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Axle Nut -->
      <polygon points="-7,-12 7,-12 14,0 7,12 -7,12 -14,0" fill="#cbd5e1" stroke="#475569"/>
      <circle cx="0" cy="0" r="5" fill="#0f172a"/>

      <!-- Text inside hub -->
      <text x="0" y="-18" fill="#f8fafc" font-size="9" font-weight="bold" text-anchor="middle">XIAOMI M365 PRO</text>
      <text x="0" y="28" fill="#4ade80" font-size="9" font-weight="bold" text-anchor="middle">260W + ЭНКОДЕР</text>

      <!-- Motor Phase and Sensor Wires coming out of axle -->
      <path d="M 0 0 Q -40 20 -70 50 Q -90 70 -95 95" fill="none" stroke="#0f172a" stroke-width="5"/>
      <path d="M 0 0 Q -40 20 -70 50 Q -90 70 -95 95" fill="none" stroke="#22c55e" stroke-width="2"/>
      <text x="-100" y="110" fill="#4ade80" font-size="9" text-anchor="middle">3 фазы + Холл + Энкодер</text>
    </g>

    <!-- Callout 4 -->
    <path d="M 450 480 L 560 480" stroke="#22c55e" stroke-width="1.5"/>
    <text x="570" y="474" fill="#4ade80" font-size="11" font-weight="bold">4. Мотор-колесо Xiaomi M365 Pro (260W)</text>
    <text x="570" y="490" fill="#cbd5e1" font-size="10">Перфорированная бескамерная шина с красным кантом</text>
    <text x="570" y="506" fill="#94a3b8" font-size="10">Ось надежно зажата в перьях вилки</text>
  </g>
</svg>
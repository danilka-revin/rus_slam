<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" style="background:#0f172a; font-family:'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="stepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="400" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Конструкция поворотного модуля (Swerve Pod)</text>
  <text x="400" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">Узел на ступице Subaru, шаговом двигателе NEMA 23 (1:7.5) и мотор-колесе самоката</text>

  <!-- Frame section (40x40 mm square tube) -->
  <g transform="translate(80, 90)">
    <!-- 40x40 Steel Tube -->
    <rect x="100" y="20" width="440" height="45" rx="3" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="105" y="25" width="430" height="35" fill="#1e293b" stroke="#475569" stroke-dasharray="3,3"/>
    <text x="320" y="46" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Сварная рама шасси: Профильная труба 40&times;40&times;2 мм</text>

    <!-- NEMA 23 Stepper Motor -->
    <rect x="130" y="75" width="85" height="105" rx="4" fill="url(#stepperGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="172" y="115" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">NEMA 23</text>
    <text x="172" y="132" fill="#e2e8f0" font-size="10" text-anchor="middle">1.9 Н&middot;м</text>
    <text x="172" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Шаговик</text>
    <!-- Stepper Shaft & Small Pulley -->
    <rect x="165" y="180" width="15" height="25" fill="#cbd5e1"/>
    <rect x="155" y="205" width="35" height="20" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="172" y="219" fill="#f8fafc" font-size="9" font-weight="bold" text-anchor="middle">z1=16</text>

    <!-- Belt -->
    <path d="M 190 215 L 340 215 M 155 215 L 305 215" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,3"/>
    <text x="250" y="208" fill="#f87171" font-size="11" font-weight="bold">Ремень HTD 5M (1:7.5)</text>

    <!-- Big Pulley z2 = 120 -->
    <rect x="295" y="200" width="170" height="28" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="380" y="218" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Ведомый шкив z2=120 (Редукция 1:7.5)</text>

    <!-- Subaru Wheel Hub Unit -->
    <rect x="330" y="75" width="100" height="115" rx="6" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="380" y="115" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">СТУПИЦА</text>
    <text x="380" y="132" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">SUBARU</text>
    <text x="380" y="150" fill="#1e293b" font-size="10" text-anchor="middle">2-рядный упорный</text>
    <text x="380" y="165" fill="#1e293b" font-size="9" text-anchor="middle">подшипник (&gt;20 кН)</text>

    <!-- Swivel Fork / Pivot Flange -->
    <path d="M 330 228 L 330 290 L 310 330 L 310 420" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linejoin="round"/>
    <path d="M 430 228 L 430 290 L 450 330 L 450 420" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linejoin="round"/>
    <text x="380" y="275" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">Стальная поворотная вилка</text>

    <!-- Scooter Hub Motor Wheel -->
    <rect x="335" y="335" width="90" height="155" rx="25" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <!-- Wheel Rim & Tyre treads -->
    <circle cx="380" cy="412" r="28" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="380" cy="412" r="8" fill="#475569"/>
    <line x1="380" y1="335" x2="380" y2="490" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="380" y="416" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">BLDC</text>
    <text x="380" y="515" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Мотор-колесо электросамоката (10&quot;, 350-500W)</text>

    <!-- Module Controller Board -->
    <rect x="490" y="120" width="130" height="165" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="555" y="145" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">Плата модуля</text>
    <rect x="500" y="160" width="110" height="26" rx="3" fill="#0284c7" opacity="0.4"/>
    <text x="555" y="177" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">Arduino Mega Pro</text>
    <rect x="500" y="192" width="110" height="26" rx="3" fill="#f97316" opacity="0.4"/>
    <text x="555" y="209" fill="#fdba74" font-size="9" font-weight="bold" text-anchor="middle">Драйвер TB6600</text>
    <rect x="500" y="224" width="110" height="45" rx="3" fill="#a855f7" opacity="0.4"/>
    <text x="555" y="242" fill="#d8b4fe" font-size="9" font-weight="bold" text-anchor="middle">3-фазный мост</text>
    <text x="555" y="258" fill="#e2e8f0" font-size="8" text-anchor="middle">6&times; MOSFET + драйвер</text>

    <!-- Callout lines -->
    <line x1="490" y1="205" x2="220" y2="140" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="555" y1="275" x2="430" y2="410" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
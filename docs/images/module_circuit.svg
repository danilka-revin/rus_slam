<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" style="background:#0f172a; font-family:'Segoe UI',Roboto,sans-serif;">
  <text x="460" y="32" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">Принципиальная функциональная схема платы модуля управления</text>
  <text x="460" y="54" fill="#94a3b8" font-size="13" text-anchor="middle">Arduino Mega Pro Embed + Драйвер TB6600 + 3-фазный мостовой MOSFET инвертор</text>

  <!-- Central Arduino Mega Pro Embed Block -->
  <g transform="translate(30, 80)">
    <rect width="280" height="440" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="280" height="35" rx="10" fill="#0284c7" opacity="0.2"/>
    <text x="140" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">ARDUINO MEGA PRO EMBED</text>
    <text x="140" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">ATmega2560 (16 МГц, 5V Logic)</text>

    <!-- Communication Block -->
    <rect x="15" y="70" width="250" height="55" rx="5" fill="#0f172a" stroke="#64748b"/>
    <text x="140" y="88" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">Связь с Бортовым ПК (Ubuntu)</text>
    <text x="25" y="110" fill="#38bdf8" font-size="10">UART0 / USB / RS485 (TX0/RX0) [115200 bps]</text>

    <!-- Pins for TB6600 -->
    <rect x="15" y="135" width="250" height="85" rx="5" fill="#0f172a" stroke="#f59e0b"/>
    <text x="140" y="153" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Выходы управления TB6600 (NEMA 23)</text>
    <text x="25" y="173" fill="#e2e8f0" font-size="10">Pin D4 → PUL+ (Импульсы шага / Step)</text>
    <text x="25" y="191" fill="#e2e8f0" font-size="10">Pin D5 → DIR+ (Направление / Direction)</text>
    <text x="25" y="209" fill="#e2e8f0" font-size="10">Pin D6 → ENA+ (Разрешение работы / Enable)</text>

    <!-- Pins for 3-Phase MOSFET Inverter -->
    <rect x="15" y="230" width="250" height="115" rx="5" fill="#0f172a" stroke="#a855f7"/>
    <text x="140" y="248" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">ШИМ-выходы 3-фазного моста (BLDC)</text>
    <text x="25" y="268" fill="#e2e8f0" font-size="10">Pin D8, D9   → IN_HA, IN_LA (Фаза A)</text>
    <text x="25" y="286" fill="#e2e8f0" font-size="10">Pin D10, D11 → IN_HB, IN_LB (Фаза B)</text>
    <text x="25" y="304" fill="#e2e8f0" font-size="10">Pin D12, D13 → IN_HC, IN_LC (Фаза C)</text>
    <text x="25" y="322" fill="#94a3b8" font-size="9">Аппаратный ШИМ 20-31.25 кГц (таймеры 1, 3)</text>

    <!-- Feedback Sensors -->
    <rect x="15" y="355" width="250" height="70" rx="5" fill="#0f172a" stroke="#22c55e"/>
    <text x="140" y="373" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">Датчики обратной связи</text>
    <text x="25" y="393" fill="#e2e8f0" font-size="10">Pin D2,D3,D18: Холл | D20,D21: Энкодер</text>
    <text x="25" y="411" fill="#e2e8f0" font-size="10">Pin D19 / A0 ← Концевик нуля азимута / Ток (ACS)</text>
  </g>

  <!-- TB6600 Driver Block -->
  <g transform="translate(350, 80)">
    <rect width="240" height="200" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="25" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">ДРАЙВЕР TB6600</text>
    <text x="120" y="45" fill="#cbd5e1" font-size="10" text-anchor="middle">Микрошаговый драйвер до 4.0А, 9-42V</text>
    
    <text x="15" y="75" fill="#e2e8f0" font-size="10">• Вход: PUL+, DIR+, ENA+ (5V Оптрон)</text>
    <text x="15" y="95" fill="#e2e8f0" font-size="10">• Силовое питание: 12-24V DC</text>
    <text x="15" y="115" fill="#e2e8f0" font-size="10">• Выход: A+, A-, B+, B- → NEMA 23</text>
    <text x="15" y="135" fill="#e2e8f0" font-size="10">• Настройка: 1/8 микрошага (1600 шаг/об)</text>
    <text x="15" y="155" fill="#e2e8f0" font-size="10">• Угловой шаг редуктора: 0.03°/шаг</text>
    <rect x="15" y="168" width="210" height="22" rx="4" fill="#b45309" opacity="0.4"/>
    <text x="120" y="183" fill="#fef08a" font-size="9" font-weight="bold" text-anchor="middle">→ На шаговик NEMA 23 (1.9 Нм)</text>
  </g>

  <!-- 3-Phase MOSFET Inverter Block -->
  <g transform="translate(350, 300)">
    <rect width="530" height="220" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="265" y="25" fill="#d8b4fe" font-size="13" font-weight="bold" text-anchor="middle">3-ФАЗНЫЙ СИЛОВОЙ ИНВЕРТОР (MOSFET BRIDGE)</text>
    
    <!-- 3 Half Bridges -->
    <!-- Phase A -->
    <rect x="20" y="45" width="150" height="125" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="95" y="65" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Фаза A (U)</text>
    <text x="30" y="85" fill="#cbd5e1" font-size="9">Драйвер FD6288/IR2101</text>
    <text x="30" y="105" fill="#4ade80" font-size="9">High-Side N-MOSFET</text>
    <text x="30" y="125" fill="#4ade80" font-size="9">Low-Side N-MOSFET</text>
    <text x="30" y="150" fill="#e2e8f0" font-size="9" font-weight="bold">Выход U → Мотор</text>

    <!-- Phase B -->
    <rect x="190" y="45" width="150" height="125" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="265" y="65" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Фаза B (V)</text>
    <text x="200" y="85" fill="#cbd5e1" font-size="9">Драйвер FD6288/IR2101</text>
    <text x="200" y="105" fill="#4ade80" font-size="9">High-Side N-MOSFET</text>
    <text x="200" y="125" fill="#4ade80" font-size="9">Low-Side N-MOSFET</text>
    <text x="200" y="150" fill="#e2e8f0" font-size="9" font-weight="bold">Выход V → Мотор</text>

    <!-- Phase C -->
    <rect x="360" y="45" width="150" height="125" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="435" y="65" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Фаза C (W)</text>
    <text x="370" y="85" fill="#cbd5e1" font-size="9">Драйвер FD6288/IR2101</text>
    <text x="370" y="105" fill="#4ade80" font-size="9">High-Side N-MOSFET</text>
    <text x="370" y="125" fill="#4ade80" font-size="9">Low-Side N-MOSFET</text>
    <text x="370" y="150" fill="#e2e8f0" font-size="9" font-weight="bold">Выход W → Мотор</text>

    <!-- Power & Protection footer -->
    <rect x="20" y="180" width="490" height="28" rx="4" fill="#581c87" opacity="0.4"/>
    <text x="265" y="198" fill="#e9d5ff" font-size="10" font-weight="bold" text-anchor="middle">Питание шины: 38.4V LiFePO4 (до 20A на фазу, защита TVS-диод + шунт токовой защиты)</text>
  </g>

  <!-- External Connections -->
  <g transform="translate(620, 80)">
    <rect width="260" height="200" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="130" y="25" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">ПРИВОД И ИСПОЛНИТЕЛИ</text>
    <text x="15" y="55" fill="#e2e8f0" font-size="10">• Шаговый мотор NEMA 23 (поворот):</text>
    <text x="25" y="72" fill="#94a3b8" font-size="9">  Фазы A+, A-, B+, B- от TB6600</text>
    <text x="15" y="95" fill="#e2e8f0" font-size="10">• BLDC мотор-колесо 10" (тяга):</text>
    <text x="25" y="112" fill="#94a3b8" font-size="9">  3 силовые фазы U, V, W</text>
    <text x="25" y="128" fill="#94a3b8" font-size="9">  5 жил датчиков Холла (5V, GND, H1, H2, H3)</text>
    <text x="15" y="150" fill="#e2e8f0" font-size="10">• Сенсор калибровки азимута:</text>
    <text x="25" y="167" fill="#94a3b8" font-size="9">  Оптический/Холл концевик нулевой точки</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="295" y1="180" x2="350" y2="180" stroke="#f59e0b" stroke-width="2"/>
  <line x1="295" y1="370" x2="350" y2="370" stroke="#a855f7" stroke-width="2"/>
</svg>
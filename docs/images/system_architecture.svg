<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="950" height="580" style="background:#0f172a; font-family:'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Архитектура системы управления роботом-курьером НТЦ АВТОВАЗ</text>
  <text x="475" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">Полноприводное шасси 4WIS/4WID (Крабовый ход) с распределенным микроконтроллерным управлением</text>

  <!-- Central Computer -->
  <rect x="300" y="80" width="350" height="115" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <rect x="300" y="80" width="350" height="28" rx="10" fill="#0284c7" opacity="0.25"/>
  <text x="475" y="100" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">БОРТОВОЙ ВЫЧИСЛИТЕЛЬ (Ubuntu 24.04/26.04 / ROS 2)</text>
  <text x="320" y="128" fill="#e2e8f0" font-size="12">• Модуль навигации Nav2 &amp; SLAM (LiDAR LDC 01 + Одометрия)</text>
  <text x="320" y="148" fill="#e2e8f0" font-size="12">• Компьютерное зрение: знаки («Стоп», переход, неровность), светофор</text>
  <text x="320" y="168" fill="#e2e8f0" font-size="12">• Кинематический преобразователь 4WIS/4WID (V_x, V_y, Omega)</text>

  <!-- Power Battery Pack -->
  <rect x="35" y="85" width="210" height="105" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="110" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">АКБ LiFePO4 12S3P</text>
  <text x="50" y="132" fill="#cbd5e1" font-size="11">• 36 ячеек 32700 (38.4V, 18Ah)</text>
  <text x="50" y="150" fill="#cbd5e1" font-size="11">• Запас энергии: ~700-750 Вт·ч</text>
  <text x="50" y="168" fill="#cbd5e1" font-size="11">• Smart BMS 60A с балансировкой</text>

  <!-- DC-DC Converters -->
  <rect x="705" y="85" width="210" height="105" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="810" y="110" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Система питания DC-DC</text>
  <text x="720" y="132" fill="#cbd5e1" font-size="11">• 38.4V → 12V (Питание ПК, драйверов)</text>
  <text x="720" y="150" fill="#cbd5e1" font-size="11">• 38.4V → 5V (Питание логики/MCU)</text>
  <text x="720" y="168" fill="#cbd5e1" font-size="11">• Силовая шина 38.4V на MOSFET инверторы</text>

  <!-- Power Lines -->
  <path d="M 245 137 L 300 137" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 650 137 L 705 137" stroke="#f59e0b" stroke-width="2"/>

  <!-- Bus Lines down to 4 modules -->
  <line x1="475" y1="195" x2="475" y2="235" stroke="#38bdf8" stroke-width="3"/>
  <line x1="115" y1="235" x2="835" y2="235" stroke="#38bdf8" stroke-width="2"/>

  <!-- Module 1: Front-Left -->
  <g transform="translate(20, 260)">
    <rect width="205" height="290" rx="8" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="205" height="24" rx="8" fill="#2563eb" opacity="0.3"/>
    <text x="102" y="17" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">МОДУЛЬ 1 (Передний левый)</text>
    <rect x="10" y="32" width="185" height="65" rx="5" fill="#1e293b" stroke="#475569"/>
    <text x="102" y="49" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Arduino Mega Pro Embed</text>
    <text x="20" y="66" fill="#94a3b8" font-size="10">• Пакетный обмен по UART</text>
    <text x="20" y="82" fill="#94a3b8" font-size="10">• PID регулирование угла/скорости</text>
    
    <rect x="10" y="104" width="185" height="80" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
    <text x="102" y="121" fill="#fdba74" font-size="11" font-weight="bold" text-anchor="middle">Поворотный привод</text>
    <text x="20" y="138" fill="#e2e8f0" font-size="10">• Драйвер TB6600 (PUL/DIR/ENA)</text>
    <text x="20" y="154" fill="#e2e8f0" font-size="10">• Шаговик NEMA 23 (1.9 Нм)</text>
    <text x="20" y="170" fill="#e2e8f0" font-size="10">• Зубчатый ремень 1:7.5 → Subaru</text>

    <rect x="10" y="192" width="185" height="85" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="102" y="209" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">Тяговый привод</text>
    <text x="20" y="226" fill="#e2e8f0" font-size="10">• 3-фазный мост на MOSFET</text>
    <text x="20" y="242" fill="#e2e8f0" font-size="10">• Мотор-колесо самоката (260W)</text>
    <text x="20" y="258" fill="#e2e8f0" font-size="10">• Датчики Холла + обратная связь</text>
  </g>

  <!-- Module 2: Front-Right -->
  <g transform="translate(260, 260)">
    <rect width="205" height="290" rx="8" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="205" height="24" rx="8" fill="#2563eb" opacity="0.3"/>
    <text x="102" y="17" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">МОДУЛЬ 2 (Передний правый)</text>
    <rect x="10" y="32" width="185" height="65" rx="5" fill="#1e293b" stroke="#475569"/>
    <text x="102" y="49" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Arduino Mega Pro Embed</text>
    <text x="20" y="66" fill="#94a3b8" font-size="10">• Пакетный обмен по UART</text>
    <text x="20" y="82" fill="#94a3b8" font-size="10">• PID регулирование угла/скорости</text>
    
    <rect x="10" y="104" width="185" height="80" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
    <text x="102" y="121" fill="#fdba74" font-size="11" font-weight="bold" text-anchor="middle">Поворотный привод</text>
    <text x="20" y="138" fill="#e2e8f0" font-size="10">• Драйвер TB6600 (PUL/DIR/ENA)</text>
    <text x="20" y="154" fill="#e2e8f0" font-size="10">• Шаговик NEMA 23 (1.9 Нм)</text>
    <text x="20" y="170" fill="#e2e8f0" font-size="10">• Зубчатый ремень 1:7.5 → Subaru</text>

    <rect x="10" y="192" width="185" height="85" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="102" y="209" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">Тяговый привод</text>
    <text x="20" y="226" fill="#e2e8f0" font-size="10">• 3-фазный мост на MOSFET</text>
    <text x="20" y="242" fill="#e2e8f0" font-size="10">• Мотор-колесо самоката (260W)</text>
    <text x="20" y="258" fill="#e2e8f0" font-size="10">• Датчики Холла + обратная связь</text>
  </g>

  <!-- Module 3: Rear-Left -->
  <g transform="translate(500, 260)">
    <rect width="205" height="290" rx="8" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="205" height="24" rx="8" fill="#2563eb" opacity="0.3"/>
    <text x="102" y="17" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">МОДУЛЬ 3 (Задний левый)</text>
    <rect x="10" y="32" width="185" height="65" rx="5" fill="#1e293b" stroke="#475569"/>
    <text x="102" y="49" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Arduino Mega Pro Embed</text>
    <text x="20" y="66" fill="#94a3b8" font-size="10">• Пакетный обмен по UART</text>
    <text x="20" y="82" fill="#94a3b8" font-size="10">• PID регулирование угла/скорости</text>
    
    <rect x="10" y="104" width="185" height="80" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
    <text x="102" y="121" fill="#fdba74" font-size="11" font-weight="bold" text-anchor="middle">Поворотный привод</text>
    <text x="20" y="138" fill="#e2e8f0" font-size="10">• Драйвер TB6600 (PUL/DIR/ENA)</text>
    <text x="20" y="154" fill="#e2e8f0" font-size="10">• Шаговик NEMA 23 (1.9 Нм)</text>
    <text x="20" y="170" fill="#e2e8f0" font-size="10">• Зубчатый ремень 1:7.5 → Subaru</text>

    <rect x="10" y="192" width="185" height="85" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="102" y="209" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">Тяговый привод</text>
    <text x="20" y="226" fill="#e2e8f0" font-size="10">• 3-фазный мост на MOSFET</text>
    <text x="20" y="242" fill="#e2e8f0" font-size="10">• Мотор-колесо самоката (260W)</text>
    <text x="20" y="258" fill="#e2e8f0" font-size="10">• Датчики Холла + обратная связь</text>
  </g>

  <!-- Module 4: Rear-Right -->
  <g transform="translate(740, 260)">
    <rect width="190" height="290" rx="8" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="190" height="24" rx="8" fill="#2563eb" opacity="0.3"/>
    <text x="95" y="17" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">МОДУЛЬ 4 (Задний правый)</text>
    <rect x="8" y="32" width="174" height="65" rx="5" fill="#1e293b" stroke="#475569"/>
    <text x="95" y="49" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Arduino Mega Pro Embed</text>
    <text x="15" y="66" fill="#94a3b8" font-size="10">• Пакетный обмен по UART</text>
    <text x="15" y="82" fill="#94a3b8" font-size="10">• PID регулирование угла/скорости</text>
    
    <rect x="8" y="104" width="174" height="80" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
    <text x="95" y="121" fill="#fdba74" font-size="11" font-weight="bold" text-anchor="middle">Поворотный привод</text>
    <text x="15" y="138" fill="#e2e8f0" font-size="10">• Драйвер TB6600 (PUL/DIR)</text>
    <text x="15" y="154" fill="#e2e8f0" font-size="10">• Шаговик NEMA 23 (1.9 Нм)</text>
    <text x="15" y="170" fill="#e2e8f0" font-size="10">• Зубчатый ремень 1:7.5 → Subaru</text>

    <rect x="8" y="192" width="174" height="85" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="95" y="209" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">Тяговый привод</text>
    <text x="15" y="226" fill="#e2e8f0" font-size="10">• 3-фазный мост на MOSFET</text>
    <text x="15" y="242" fill="#e2e8f0" font-size="10">• Мотор-колесо самоката (260W)</text>
    <text x="15" y="258" fill="#e2e8f0" font-size="10">• Датчики Холла + связь</text>
  </g>

  <!-- Connectors to modules -->
  <line x1="122" y1="235" x2="122" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362" y1="235" x2="362" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602" y1="235" x2="602" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="835" y1="235" x2="835" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
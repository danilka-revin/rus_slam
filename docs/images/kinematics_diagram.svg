<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="background:#0f172a; font-family:'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Кинематическая схема полноуправляемого шасси 4WIS/4WID</text>
  <text x="480" y="54" fill="#94a3b8" font-size="13" text-anchor="middle">Сравнение режима крабового хода (параллельный сдвиг) и разворота на месте (нулевой радиус)</text>

  <!-- ==================================================================== -->
  <!-- LEFT PANEL: Крабовый ход (Crab Walk / Omnidirectional)               -->
  <!-- ==================================================================== -->
  <g transform="translate(35, 75)">
    <rect width="425" height="520" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="425" height="36" rx="10" fill="#0284c7" opacity="0.25"/>
    <text x="212" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">РЕЖИМ 1: КРАБОВЫЙ ХОД (Crab Walk)</text>
    <text x="212" y="54" fill="#cbd5e1" font-size="11" text-anchor="middle">Все 4 колеса сориентированы параллельно под единым углом θ</text>

    <!-- Chassis Body (200 x 280) -->
    <!-- Center of chassis is at (212, 225) -->
    <rect x="112" y="85" width="200" height="280" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Direction indicator (robot heading) -->
    <line x1="212" y1="85" x2="212" y2="65" stroke="#64748b" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="212" y="60" fill="#94a3b8" font-size="10" text-anchor="middle">КУРС РОБОТА (ВПЕРЕД)</text>

    <!-- Center point and global velocity vector -->
    <circle cx="212" cy="225" r="5" fill="#f59e0b"/>
    <line x1="212" y1="225" x2="265" y2="172" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrowAmber)"/>
    <text x="275" y="170" fill="#fbbf24" font-size="13" font-weight="bold">V_robot (θ = 45°)</text>

    <!-- 4 Wheels in Crab Mode: All rotated by 45 degrees, all velocities parallel -->
    <!-- Wheel 1: FL (112, 85) -->
    <g transform="translate(112, 85) rotate(45)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    </g>
    <text x="68" y="85" fill="#93c5fd" font-size="11" font-weight="bold">1: FL</text>

    <!-- Wheel 2: FR (312, 85) -->
    <g transform="translate(312, 85) rotate(45)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    </g>
    <text x="332" y="85" fill="#93c5fd" font-size="11" font-weight="bold">2: FR</text>

    <!-- Wheel 3: RL (112, 365) -->
    <g transform="translate(112, 365) rotate(45)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    </g>
    <text x="68" y="370" fill="#93c5fd" font-size="11" font-weight="bold">3: RL</text>

    <!-- Wheel 4: RR (312, 365) -->
    <g transform="translate(312, 365) rotate(45)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>
    </g>
    <text x="332" y="370" fill="#93c5fd" font-size="11" font-weight="bold">4: RR</text>

    <!-- Math description box -->
    <rect x="15" y="415" width="395" height="90" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="25" y="435" fill="#38bdf8" font-size="11" font-weight="bold">Кинематические уравнения крабового хода:</text>
    <text x="25" y="455" fill="#e2e8f0" font-size="11">• δ₁ = δ₂ = δ₃ = δ₄ = atan2(Vy, Vx)</text>
    <text x="25" y="473" fill="#e2e8f0" font-size="11">• V₁ = V₂ = V₃ = V₄ = √(Vx² + Vy²)</text>
    <text x="25" y="492" fill="#4ade80" font-size="11">✓ Угловая скорость ωz = 0 (смещение без разворота)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT PANEL: Разворот на месте (Zero-Radius Spin / In-Place Turn)    -->
  <!-- ==================================================================== -->
  <g transform="translate(500, 75)">
    <rect width="425" height="520" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="425" height="36" rx="10" fill="#dc2626" opacity="0.2"/>
    <text x="212" y="24" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">РЕЖИМ 2: РАЗВОРОТ НА МЕСТЕ (R = 0)</text>
    <text x="212" y="54" fill="#cbd5e1" font-size="11" text-anchor="middle">Колеса перпендикулярны диагоналям шасси (касательны к окружности)</text>

    <!-- Center is at (212, 225) -->
    <!-- Chassis Body (200 x 280) -->
    <rect x="112" y="85" width="200" height="280" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Diagonal radius lines from center to wheel pivot points -->
    <line x1="212" y1="225" x2="112" y2="85" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="212" y1="225" x2="312" y2="85" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="212" y1="225" x2="112" y2="365" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="212" y1="225" x2="312" y2="365" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Concentric trajectory circle (R = hypot(100, 140) = 172 px) -->
    <circle cx="212" cy="225" r="172" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>

    <!-- Central Rotation Symbol (Clockwise Rotation Ω) -->
    <circle cx="212" cy="225" r="6" fill="#ef4444"/>
    <!-- Circular Arrow for CW rotation -->
    <path d="M 190 205 A 30 30 0 1 1 234 205" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="212" y="255" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">Ω (Вращение по часовой)</text>

    <!-- 
      Exact geometry for CLOCKWISE (CW) rotation:
      Center: (212, 225)
      FL at (112, 85): dx=-100, dy=-140 -> Tangent: dx_t=+140, dy_t=-100 (points right-up)
                       Angle of tangent = atan2(-100, 140) = -35.5 deg
                       SVG rotate = -35.5 + 90 = 54.5 deg!
      FR at (312, 85): dx=+100, dy=-140 -> Tangent: dx_t=+140, dy_t=+100 (points right-down)
                       Angle of tangent = atan2(100, 140) = +35.5 deg
                       SVG rotate = 35.5 + 90 = 125.5 deg!
      RR at (312, 365): dx=+100, dy=+140 -> Tangent: dx_t=-140, dy_t=+100 (points left-down)
                       Angle of tangent = atan2(100, -140) = +144.5 deg
                       SVG rotate = 144.5 + 90 = 234.5 deg (-125.5 deg)!
      RL at (112, 365): dx=-100, dy=+140 -> Tangent: dx_t=-140, dy_t=-100 (points left-up)
                       Angle of tangent = atan2(-100, -140) = -144.5 deg
                       SVG rotate = -144.5 + 90 = -54.5 deg!
    -->

    <!-- Wheel 1: FL at (112, 85) -->
    <g transform="translate(112, 85) rotate(54.5)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <!-- Perpendicular forward rolling arrow along tangent -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    </g>
    <text x="60" y="85" fill="#fca5a5" font-size="11" font-weight="bold">1: FL</text>

    <!-- Wheel 2: FR at (312, 85) -->
    <g transform="translate(312, 85) rotate(125.5)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <!-- Perpendicular forward rolling arrow along tangent -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    </g>
    <text x="332" y="85" fill="#fca5a5" font-size="11" font-weight="bold">2: FR</text>

    <!-- Wheel 3: RL at (112, 365) -->
    <g transform="translate(112, 365) rotate(-54.5)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <!-- Perpendicular forward rolling arrow along tangent -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    </g>
    <text x="60" y="370" fill="#fca5a5" font-size="11" font-weight="bold">3: RL</text>

    <!-- Wheel 4: RR at (312, 365) -->
    <g transform="translate(312, 365) rotate(-125.5)">
      <rect x="-15" y="-30" width="30" height="60" rx="5" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
      <!-- Perpendicular forward rolling arrow along tangent -->
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    </g>
    <text x="332" y="370" fill="#fca5a5" font-size="11" font-weight="bold">4: RR</text>

    <!-- Math description box -->
    <rect x="15" y="415" width="395" height="90" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="25" y="435" fill="#f87171" font-size="11" font-weight="bold">Уравнения разворота на месте (Vx = 0, Vy = 0, ωz = Ω):</text>
    <text x="25" y="455" fill="#e2e8f0" font-size="10">• Окружность: R_turn = √(L² + W²) / 2 (центр в (0,0))</text>
    <text x="25" y="472" fill="#e2e8f0" font-size="10">• Каждое колесо повернуто строго по касательной к окружности</text>
    <text x="25" y="490" fill="#e2e8f0" font-size="10">• Линейная скорость колес: V_i = |Ω| · R_turn (без бокового трения!)</text>
  </g>
</svg>
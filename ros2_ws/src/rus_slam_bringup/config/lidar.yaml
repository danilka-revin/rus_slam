# ============================================================================
# Лидар ЛДС-01: порт и параметры кадра протокола
# Формат кадра по умолчанию совместим с семейством компактных UART-лидаров;
# поля уточняются по паспорту конкретного экземпляра.
# ============================================================================

lds01_driver_node:
  ros__parameters:
    port: /dev/rus_lidar
    baud_rate: 230400
    frame_id: lidar_link
    sync_byte: 0x54
    ver_len: 0x2C               # 12 точек на кадр
    min_range_m: 0.12
    max_range_m: 12.0
    stale_warn_sec: 1.5

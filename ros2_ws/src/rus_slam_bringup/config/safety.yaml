# ============================================================================
# Безопасность: гейт скоростей
# ============================================================================

safety_node:
  ros__parameters:
    modules_required: 4         # сколько модулей должно быть в телеметрии
    comms_timeout_sec: 0.6      # нет /modules/state дольше — аварийный стоп
    battery_low_v: 35.5         # ползущий режим
    battery_critical_v: 33.5    # аварийный стоп (12S LiFePO4)
    battery_stale_sec: 6.0      # данные АКБ протухли — не блокируем движение
    creep_limit: 0.2            # доля скорости в ползущем режиме
    publish_rate_hz: 20.0

# ============================================================================
# Миссия доставки: точки маршрута в системе координат карты (м)
# Задаются после картирования полигона НТЦ. Порядок списка = порядок объезда.
# ============================================================================

mission_manager_node:
  ros__parameters:
    waypoints:
      - {name: start,        x: 0.0, y: 0.0, yaw: 0.0}
      - {name: sklad_a,      x: 5.0, y: 2.0, yaw: 1.57}
      - {name: lab_b,        x: 12.0, y: 6.0, yaw: 0.0}
      - {name: finish,       x: 0.0, y: 0.0, yaw: 0.0}
    start_delay_sec: 3.0
    stop_hold_sec: 3.0          # выдержка у знака «Стоп»
    slowdown_limit: 0.3         # доля скорости на «лежачем полицейском»
    slowdown_hold_sec: 5.0
    goal_timeout_sec: 300.0
